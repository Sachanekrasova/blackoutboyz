<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sacha Nekrasova</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: white;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 11px;
      color: black;
      overflow-x: hidden;
    }
    .top-left {
      position: absolute;
      left: 20px;
      bottom: 20px;
      text-align: left;
      max-width: 220px;
      line-height: 1.3;
      user-select: none;
    }
    .name {
      font-weight: 400;
      font-size: 12px;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    #lang-toggle {
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      background: none;
      border: none;
      color: black;
      text-decoration: none; /* No underline */
      margin-bottom: 8px;
      padding: 0;
    }
    nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 0;
    }
    nav a {
      cursor: pointer;
      color: black;
      text-decoration: none;
      font-weight: 400;
      font-size: 11px;
      padding: 2px 0;
      transition: color 0.2s, font-weight 0.2s;
    }
    nav a:hover {
      font-weight: 600;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="top-left">
    <div class="name" id="name">Sacha Nekrasova</div>
    <button id="lang-toggle">RU</button>
    <nav>
      <a href="#" data-section="works" id="works-link">Works</a>
      <a href="#" data-section="bio" id="bio-link">Bio</a>
      <a href="#" data-section="contact" id="contact-link">Contact</a>
    </nav>
  </div>
  <script>
    const langToggle = document.getElementById('lang-toggle');
    const nameElem = document.getElementById('name');
    const worksLink = document.getElementById('works-link');
    const bioLink = document.getElementById('bio-link');
    const contactLink = document.getElementById('contact-link');

    let isRussian = false;

    function updateLanguage() {
      nameElem.textContent = isRussian ? 'Саша Некрасова' : 'Sacha Nekrasova';
      worksLink.textContent = isRussian ? 'Работы' : 'Works';
      bioLink.textContent = isRussian ? 'Биография' : 'Bio';
      contactLink.textContent = isRussian ? 'Контакты' : 'Contact';
      langToggle.textContent = isRussian ? 'EN' : 'RU';
    }

    langToggle.addEventListener('click', () => {
      isRussian = !isRussian;
      updateLanguage();
    });

    // Make nav links clickable (no content yet)
    [worksLink, bioLink, contactLink].forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        // You can add content logic here later
      });
    });

    updateLanguage();
  </script>
</body>
</html>
